<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대탈출 역극</title>
  <link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Galmuri14.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 타이틀 -->
  <section id="screen-title" class="screen active">
    <div class="title-box">
      <div class="title-icon" id="title-icon"></div>
      <p class="eyebrow">자캐 역극 탈출 게임</p>
      <h1>THE GREAT ESCAPE</h1>
      <p class="sub">…눈을 떴을 때, 문은 이미 잠겨 있었다.</p>
      <div class="menu">
        <button id="btn-online" class="primary">친구와 플레이</button>
        <button id="btn-continue" hidden>이어하기</button>
        <button id="btn-chars">캐릭터 관리</button>
      </div>
    </div>
  </section>

  <!-- 캐릭터 관리 -->
  <section id="screen-chars" class="screen">
    <header class="bar">
      <button class="back" data-go="title">← 뒤로</button>
      <h2>캐릭터 관리</h2>
    </header>
    <div class="chars-layout">
      <form id="char-form" class="panel">
        <h3 id="form-title">새 캐릭터</h3>
        <input type="hidden" name="id">
        <label>이름 <input name="name" required maxlength="20" placeholder="예: 한서린"></label>
        <label>테마색 <input name="color" type="color" value="#8e3a2e"></label>
        <fieldset class="sprite-picker">
          <legend>초상화</legend>
          <div id="sprite-options" class="sprite-options"></div>
        </fieldset>
        <label>이미지 URL (선택) <input name="image" type="url" placeholder="https://..."></label>
        <label>성격
          <select name="personality"></select>
        </label>
        <label>특기
          <select name="skill"></select>
        </label>
        <p class="skill-desc" id="skill-desc"></p>
        <label>한 줄 소개 <textarea name="intro" rows="2" maxlength="120" placeholder="예: 겁은 많지만 눈치는 빠른 대학생"></textarea></label>
        <div class="row">
          <button type="submit" class="primary">저장</button>
          <button type="button" id="form-reset">새로 작성</button>
        </div>
      </form>
      <div class="panel">
        <h3>내 캐릭터 <span id="char-count" class="muted"></span></h3>
        <ul id="char-list" class="char-list"></ul>
        <div class="row">
          <button type="button" id="btn-export-chars">내보내기</button>
          <label class="file-btn">불러오기<input type="file" id="import-chars" accept=".json" hidden></label>
        </div>
      </div>
    </div>
  </section>

  <!-- 방 만들기 / 참가 -->
  <section id="screen-online" class="screen">
    <header class="bar">
      <button class="back" data-go="title">← 뒤로</button>
      <h2>친구와 플레이</h2>
    </header>
    <div class="online-layout">
      <div class="panel">
        <h3>1. 참가 방식</h3>
        <div class="seg">
          <label><input type="radio" name="role" value="player" checked> 내 캐릭터로 참가</label>
          <label><input type="radio" name="role" value="gm"> 진행자(GM)로 참가</label>
        </div>
        <p id="role-desc" class="muted small"></p>
        <div id="pick-wrap">
          <h3>2. 데려갈 캐릭터</h3>
          <ul id="pick-list" class="char-list pick"></ul>
          <p id="pick-empty" class="muted" hidden>먼저 <button type="button" data-go="chars">캐릭터 관리</button>에서 캐릭터를 만들어 주세요.</p>
        </div>
      </div>
      <div class="panel">
        <h3>방 만들기</h3>
        <label>에피소드 <select id="episode-select"></select></label>
        <p id="episode-desc" class="muted small"></p>
        <button id="btn-create" class="primary wide">방 만들기</button>
        <h3 class="gap">방 참가하기</h3>
        <label>초대 코드 <input id="join-code" maxlength="4" placeholder="예: K7QX" autocomplete="off"></label>
        <button id="btn-join" class="wide">참가하기</button>
        <p id="online-error" class="error" hidden></p>
      </div>
    </div>
  </section>

  <!-- 대기실 -->
  <section id="screen-lobby" class="screen">
    <header class="bar">
      <button id="btn-leave" class="back">← 나가기</button>
      <h2>대기실</h2>
    </header>
    <div class="panel narrow">
      <p class="eyebrow">초대 코드</p>
      <div class="code-row">
        <span id="lobby-code" class="room-code"></span>
        <button id="btn-copy-link">초대 링크 복사</button>
      </div>
      <h3 id="lobby-ep"></h3>
      <p id="lobby-summary" class="muted small"></p>
      <h3 class="gap">참가자</h3>
      <ul id="lobby-players" class="char-list"></ul>
      <button id="btn-lobby-start" class="primary wide" hidden>녹화 시작</button>
      <p id="lobby-wait" class="muted small center" hidden>방장이 녹화를 시작하기를 기다리는 중…</p>
    </div>
  </section>

  <!-- 인트로 -->
  <section id="screen-intro" class="screen">
    <div class="intro-box">
      <p id="intro-ep" class="eyebrow"></p>
      <div id="intro-text" class="intro-text"></div>
      <button id="btn-intro-next" class="primary">다음 ▶</button>
    </div>
  </section>

  <!-- 게임 -->
  <section id="screen-game" class="screen">
    <header class="game-bar">
      <div>
        <span id="ep-name" class="ep-name"></span>
      </div>
      <div class="game-tools">
        <span id="net-status" class="net-status" hidden>연결 끊김…</span>
        <span id="timer" class="timer">30:00</span>
        <button id="btn-pause" hidden>일시정지</button>
        <button id="btn-hint">힌트 (-3분)</button>
        <button id="btn-quit">나가기</button>
      </div>
    </header>
    <div class="game-layout">
      <aside class="col col-left">
        <h4>출연진</h4>
        <div id="team" class="team"></div>
      </aside>
      <main class="col col-center">
        <div id="map" class="map"></div>
        <section class="room-panel">
          <div class="room-head">
            <h3 id="room-name"></h3>
            <span id="room-people" class="muted"></span>
          </div>
          <p id="room-desc" class="room-desc"></p>
          <div id="objects" class="objects"></div>
          <div id="exits" class="exits"></div>
        </section>
      </main>
      <aside class="col col-right">
        <nav id="channels" class="channels"></nav>
        <div id="log" class="log"></div>
        <form id="rp-form" class="rp-form">
          <div class="rp-who" id="rp-who"></div>
          <div class="rp-row">
            <select id="rp-mode"></select>
            <input id="rp-text" autocomplete="off" placeholder="캐릭터로 말하거나 행동해 보세요">
            <button class="primary">전송</button>
          </div>
          <p id="rp-range" class="rp-range"></p>
        </form>
      </aside>
    </div>
  </section>

  <!-- 엔딩 -->
  <section id="screen-ending" class="screen">
    <div class="intro-box">
      <h1 id="ending-title"></h1>
      <p id="ending-text" class="sub"></p>
      <div id="ending-team" class="ending-team"></div>
      <div class="menu">
        <button id="btn-save-log" class="primary">역극 로그 저장 (.txt)</button>
        <button id="btn-ending-title">타이틀로</button>
      </div>
    </div>
  </section>

  <!-- 자물쇠 모달 -->
  <dialog id="lock-dialog">
    <form method="dialog" id="lock-form">
      <h3 id="lock-title"></h3>
      <p id="lock-prompt" class="muted"></p>
      <p id="lock-hint" class="hint" hidden></p>
      <input id="lock-input" autocomplete="off">
      <div class="row">
        <button value="cancel" formnovalidate>취소</button>
        <button id="lock-force" type="button" hidden>힘으로 연다</button>
        <button value="ok" class="primary">입력</button>
      </div>
    </form>
  </dialog>

  <!-- 아이템 건네기 모달 -->
  <dialog id="give-dialog">
    <form method="dialog">
      <h3 id="give-title"></h3>
      <div id="give-targets" class="give-targets"></div>
      <div class="row"><button value="cancel">취소</button></div>
    </form>
  </dialog>

  <script src="js/pixels.js"></script>
  <script src="js/voices.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
